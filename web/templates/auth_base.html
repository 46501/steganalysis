<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080b11">
  <title>{% block title %}StegoVault — Cybersecurity Steganography{% endblock %}</title>
  <meta name="description" content="StegoVault — Production-ready steganography toolkit and forensic analysis platform.">
  <link rel="icon" type="image/svg+xml" href="/static/stegovault-favicon.svg">
  <link rel="icon" type="image/png" sizes="64x64" href="/static/stegovault-favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/auth.css">
</head>
<body class="auth-body">
  <div class="auth-app-wrapper">
    <!-- Top Bar Navigation -->
    <header class="auth-topbar">
      <div class="topbar-inner">
        <a href="/" class="brand-link" aria-label="StegoVault Home">
          <img class="brand-mark" src="/static/stegovault-logo.png" alt="StegoVault" width="30" height="30">
          <span class="brand-title">StegoVault</span>
        </a>

        <div class="topbar-actions">
          {% if current_user %}
            <a href="/dashboard" class="topbar-btn {% if active_nav == 'dashboard' %}active{% endif %}">
              <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="3" width="7" height="9" rx="1.5"/>
                <rect x="14" y="3" width="7" height="5" rx="1.5"/>
                <rect x="14" y="12" width="7" height="9" rx="1.5"/>
                <rect x="3" y="16" width="7" height="5" rx="1.5"/>
              </svg>
              <span>Dashboard</span>
            </a>
            <a href="/app" class="topbar-btn topbar-btn-primary">
              <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
              </svg>
              <span>Workbench</span>
            </a>
            <div class="user-pill-dropdown">
              <a href="/profile" class="user-pill" title="Account Settings">
                <div class="user-avatar-mini">{{ current_user.full_name[:2].upper() }}</div>
                <span class="user-name-mini">{{ current_user.username }}</span>
              </a>
              <a href="/logout" class="topbar-btn topbar-btn-logout" title="Sign Out">
                <svg class="topbar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                  <polyline points="16 17 21 12 16 7"/>
                  <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span class="desktop-only">Sign Out</span>
              </a>
            </div>
          {% else %}
            <a href="/welcome" class="topbar-btn">Features</a>
            <a href="/login" class="topbar-btn">Sign In</a>
            <a href="/register" class="topbar-btn topbar-btn-primary">Create Account</a>
          {% endif %}
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="auth-main" id="main-content">
      <!-- Flash / Alert notification container -->
      <div class="toast-container" id="toast-container" aria-live="polite"></div>

      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="auth-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <img class="footer-logo" src="/static/stegovault-logo-32.png" alt="" width="18" height="18" aria-hidden="true">
          <span>StegoVault</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="/static/auth.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

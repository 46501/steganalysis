# =============================================================================
# StegoShield AI — Root Alembic Configuration Redirector
# Allows running 'alembic ...' directly from repository root
# =============================================================================

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend
version_path_separator = os

sqlalchemy.url = postgresql+psycopg2://postgres:postgres_secure_password@localhost:5432/steganalysis

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

